<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F2D57">
  <title>ÑanGO · Transporte público de Juliaca</title>
  <meta name="description" content="Guía de transporte público de Juliaca: rutas, tarifas, hora punta y avisos, sin GPS.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <!-- Tipografías, íconos y mapa: primero los archivos locales de assets/vendor (npm run vendor);
       si todavía no se descargaron, se piden a internet como antes. -->
  <link rel="stylesheet" href="assets/vendor/fonts/fonts.css" onerror="this.onerror=null;this.href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&display=swap'">
  <link rel="stylesheet" href="assets/vendor/tabler/tabler-icons.min.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/dist/tabler-icons.min.css'">
  <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'">

  <!-- Estilos propios, en orden -->
  <link rel="stylesheet" href="css/00-tokens.css">
  <link rel="stylesheet" href="css/01-base.css">
  <link rel="stylesheet" href="css/02-components.css">
  <link rel="stylesheet" href="css/03-map.css">
  <link rel="stylesheet" href="css/04-flow.css">
  <link rel="stylesheet" href="css/05-home.css">
  <link rel="stylesheet" href="css/06-search.css">
  <link rel="stylesheet" href="css/07-lines.css">
  <link rel="stylesheet" href="css/08-alerts.css">
  <link rel="stylesheet" href="css/09-profile.css">
  <link rel="stylesheet" href="css/10-trip.css">
  <link rel="stylesheet" href="css/99-animations.css">
</head>
<body>
  <div id="app" class="app" data-theme="light">
    <main id="screen" class="screen" aria-live="polite"></main>
    <nav id="tabbar" class="tabbar is-hidden" role="tablist" aria-label="Navegación principal"></nav>
  </div>
  <noscript>ÑanGO necesita JavaScript para funcionar.</noscript>

  <script src="assets/vendor/leaflet/leaflet.js"></script>
  <script>window.L || document.write('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>')</script>
  <script>
    // Capturador de errores en pantalla para depurar en el celular
    window.addEventListener('error', function(e) {
      document.body.innerHTML = '<div style="padding:20px;color:red;font-family:sans-serif;background:#fff;">' +
        '<h2>Error de ejecución en Android:</h2>' +
        '<p><b>Mensaje:</b> ' + e.message + '</p>' +
        '<p><b>Archivo:</b> ' + e.filename + ' (Línea ' + e.lineno + ')</p>' +
        '</div>';
    });
  </script>

  <script src="assets/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
  <script type="module" src="js/main.js"></script>
</body>
</html>
